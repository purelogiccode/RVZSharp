name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Generate the public API reference from the library XML comments and publish it
      # under /api/. Jekyll copies the generated static site as part of docs/.
      - name: Build DocFX API reference
        run: |
          dotnet tool restore
          dotnet docfx docfx/docfx.json
          mkdir -p docs/api
          cp -r docfx/_site/. docs/api/

      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
      - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5